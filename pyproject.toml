[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geosocialpy"
version = "0.1.0"
description = "Fetch geotagged tweets by geographic radius via the X (Twitter) API v2."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Jayesh Kishor Suryavanshi", email = "jayeshki@buffalo.edu" }]
keywords = ["twitter", "x", "geospatial", "tweets", "tweepy"]
dependencies = ["tweepy>=4.10"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
example = ["python-dotenv"]

[project.urls]
Homepage = "https://github.com/JayeshSuryavanshi/GeoSocialPy"

[tool.setuptools.packages.find]
include = ["geosocialpy*"]
