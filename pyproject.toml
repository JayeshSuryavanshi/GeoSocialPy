[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "geosocialpy"
version = "0.2.0"
description = "Fetch geotagged tweets by geographic radius via the X (Twitter) API v2."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jayesh Kishor Suryavanshi", email = "jayeshki@buffalo.edu" }]
keywords = ["twitter", "x", "geospatial", "tweets", "tweepy"]
dependencies = ["tweepy>=4.10"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
example = ["python-dotenv"]
maps = ["folium>=0.14"]
test = ["coverage>=7"]

[project.scripts]
geosocialpy = "geosocialpy.cli:main"

[project.urls]
Homepage = "https://github.com/JayeshSuryavanshi/GeoSocialPy"
Repository = "https://github.com/JayeshSuryavanshi/GeoSocialPy"
Issues = "https://github.com/JayeshSuryavanshi/GeoSocialPy/issues"

[tool.setuptools.packages.find]
include = ["geosocialpy*"]

[tool.setuptools.package-data]
geosocialpy = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
