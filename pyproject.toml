[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "GeoSocialX"
version = "0.7.0"
description = "Map the geography of geotagged social/location data — hotspots, time trends, GeoJSON & maps, dependency-free."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jayesh Kishor Suryavanshi", email = "jayeshki@buffalo.edu" }]
keywords = [
    "geospatial",
    "gis",
    "geojson",
    "hotspots",
    "spatial-analysis",
    "location",
    "mapping",
    "csv",
    "social-media",
    "x-api",
    "bluesky",
    "atproto",
]
dependencies = ["tweepy>=4.10"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
example = ["python-dotenv"]
maps = ["folium>=0.14"]
bluesky = ["atproto>=0.0.55"]
test = ["coverage[toml]>=7"]

[project.scripts]
geosocialx = "geosocialx.cli:main"

[project.urls]
Homepage = "https://github.com/JayeshSuryavanshi/GeoSocialX"
Repository = "https://github.com/JayeshSuryavanshi/GeoSocialX"
Issues = "https://github.com/JayeshSuryavanshi/GeoSocialX/issues"
Changelog = "https://github.com/JayeshSuryavanshi/GeoSocialX/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["geosocialx*"]

[tool.setuptools.package-data]
geosocialx = ["py.typed"]
"geosocialx.data" = ["*.geojson"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
packages = ["geosocialx"]

[[tool.mypy.overrides]]
module = ["tweepy.*", "folium.*", "dotenv.*", "atproto.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["geosocialx"]

[tool.coverage.report]
fail_under = 90
