name: Release

# Publishes to PyPI when a version tag (e.g. v0.3.0) is pushed, using PyPI
# Trusted Publishing (OIDC) — no long-lived API token is stored anywhere.
#
# One-time setup: register this repo + workflow as a Trusted Publisher for the
# `geosocialx` project at https://pypi.org/manage/project/geosocialx/settings/publishing/
# (workflow: release.yml, environment: pypi).

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches the packaged version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=$TAG packaged=$VER"
          test "$TAG" = "$VER" || { echo "::error::tag v$TAG does not match pyproject version $VER"; exit 1; }
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
