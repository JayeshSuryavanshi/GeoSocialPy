name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with maps + test extras
        run: |
          python -m pip install --upgrade pip
          pip install ".[maps,test]"
      - name: Run tests (with coverage)
        run: coverage run -m unittest discover -s tests -v
      - name: Coverage gate (fail under 90%)
        run: coverage report --fail-under=90

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + mypy
        run: |
          python -m pip install --upgrade pip
          pip install ".[maps,example]" mypy
      - name: Mypy (verify the shipped py.typed hints)
        run: mypy geosocialx
